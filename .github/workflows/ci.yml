name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:test
      - name: ABI export is up to date
        run: pnpm contracts:build && pnpm abi && git diff --exit-code packages/shared/src/abi
      - run: pnpm --filter @sway/shared test
      - run: pnpm --filter @sway/web test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
